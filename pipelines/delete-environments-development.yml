
pool:
  vmImage: windows-latest

trigger: none

schedules:
  - cron: '0 0 * * *'
    displayName: Daily midnight run
    branches:
      include:
        - master
    always: true

resources:
  repositories:
    - repository: power-pipelines
      name: ewingjm/power-pipelines
      ref: refs/heads/feat/support-github-repositories
      type: github
      endpoint: github.com_ewingjm

variables:
  - group: Environment - Imports - DEV

extends:
  template: templates/power-platform/pipelines/delete-work-item-environments-pipeline.yml@power-pipelines
  parameters:
    serviceConnection: $(Environment.ManagementApp.ServiceConnectionName)
    categorystates:
      - Removed
      - Completed
    metadata:
      environment: development
    createdby: 1c0e6ba5-cf1d-4cb9-90a2-984ccf5b9a6d