trigger:
  branches:
    include:
      - master
  paths:
    include:
      - data/deletion/*

pool:
  vmImage: windows-latest

resources:
  repositories:
    - repository: power-pipelines
      name: ewingjm/power-pipelines
      ref: refs/heads/main
      type: github
      endpoint: github.com_ewingjm

extends:
  template: templates/power-platform/pipelines/sync-bulk-deletes-pipeline.yml@power-pipelines
  parameters:
    serviceConnection: Power Platform - Deployment (defradev)
    environment: TST
    url: https://defra-cit-test.crm4.dynamics.com/
    sourceFolder: data/deletion