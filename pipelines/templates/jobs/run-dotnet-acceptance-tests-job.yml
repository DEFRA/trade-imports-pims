parameters:
  - name: project
    type: string
    default: tests\Defra.Imports.Specs\Defra.Imports.Specs.csproj
  - name: dotNetSdkVersion
    type: string
    default: 8.x
  - name: url
    type: string
    default: $(BuildTools.EnvironmentUrl)
  - name: clientId
    type: string
  - name: keyVaultTenantId
    type: string
  - name: keyVaultClientId
    type: string
  - name: keyVaultClientSecret
    type: string
  - name: keyVaultName
    type: string
  - name: parallelWorkers
    type: string
    default: 4
  - name: testTimeoutMinutes
    type: number
    default: 10
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: succeeded()

jobs:
  - job: RunDotNetAcceptanceTests
    displayName: Run .NET acceptance tests
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    pool:
      name: playwright-medium
    variables:
      RunDotNetAcceptanceTests.Url: ${{ parameters.url }}
      RunDotNetAcceptanceTests.ClientId: ${{ parameters.clientId }}
      RunDotNetAcceptanceTests.KeyVault.TenantId: ${{ parameters.keyVaultTenantId }}
      RunDotNetAcceptanceTests.KeyVault.ClientId: ${{ parameters.keyVaultClientId }}
      RunDotNetAcceptanceTests.KeyVault.ClientSecret: ${{ parameters.keyVaultClientSecret }}
      RunDotNetAcceptanceTests.KeyVault.Name: ${{ parameters.keyVaultName }}
      RunDotNetAcceptanceTests.ParallelWorkers: ${{ parameters.parallelWorkers }}
    steps:
      - checkout: self

      - task: UseDotNet@2
        displayName: Use .NET SDK
        inputs:
          version: ${{ parameters.dotNetSdkVersion }}

      - task: DotNetCoreCLI@2
        displayName: Build acceptance tests
        inputs:
          command: build
          projects: ${{ parameters.project }}
          arguments: --configuration Release

      - powershell: |
          $ms = [int]${{ parameters.testTimeoutMinutes }} * 60000
          Write-Host "##vso[task.setvariable variable=RunDotNetAcceptanceTests.TestTimeoutMs]$ms"
        displayName: Calculate test timeout in milliseconds

      - task: DotNetCoreCLI@2
        displayName: Run acceptance tests
        inputs:
          command: test
          projects: ${{ parameters.project }}
          arguments: >-
            --configuration Release --no-build
            -- MSTest.Parallelize.Workers=$(RunDotNetAcceptanceTests.ParallelWorkers)
            MSTest.TestTimeout=$(RunDotNetAcceptanceTests.TestTimeoutMs)
          publishTestResults: true
          testRunTitle: Acceptance tests
        env:
          IMPORTS__TEST__Url: $(RunDotNetAcceptanceTests.Url)
          IMPORTS__TEST__ClientId: $(RunDotNetAcceptanceTests.ClientId)
          IMPORTS__TEST__KeyVault__TenantId: $(RunDotNetAcceptanceTests.KeyVault.TenantId)
          IMPORTS__TEST__KeyVault__ClientId: $(RunDotNetAcceptanceTests.KeyVault.ClientId)
          IMPORTS__TEST__KeyVault__ClientSecret: $(RunDotNetAcceptanceTests.KeyVault.ClientSecret)
          IMPORTS__TEST__KeyVault__Name: $(RunDotNetAcceptanceTests.KeyVault.Name)
