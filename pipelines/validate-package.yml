name: $(GITVERSION_FullSemVer)

pool:
  vmImage: windows-latest

trigger: none
pr:
  drafts: false
  autoCancel: false
  branches:
    include:
      - main
      - releases/*
  paths:
    include:
      - deploy
      - src
      - tests
      - Defra.Imports.sln
      - GitVersion.yml
      - pipelines/validate-package.yml
      - pipelines/templates/steps/run-typescript-unit-tests-steps.yml
      - pipelines/templates/steps/sonarqube-prepare-steps.yml
      - pipelines/templates/steps/sonarqube-publish-steps.yml
      - pipelines/templates/jobs/create-application-user-job.yml
      - data/core/extract
      - data/core/import.json
    exclude:
      - '**/*.md'

resources:
  repositories:
    - repository: power-pipelines
      name: ewingjm/power-pipelines
      ref: refs/heads/feature/validation-pipeline-enhancements
      type: github
      endpoint: github.com_ewingjm

variables:
  - group: Environment - Imports - CI
  - group: Tests - Imports - CI
  - group: Key Vault - Test Users - defradev
  - group: GitHub

extends:
  template: templates/power-platform/pipelines/validate-package-pipeline.yml@power-pipelines
  parameters:
    dotNetSdkVersion: 8.x
    packageProject: deploy\Defra.Imports.Deployment\Defra.Imports.Deployment.csproj
    unitTestsProject: tests\Defra.Imports.UnitTests\Defra.Imports.UnitTests.csproj
    serviceConnection: $(Environment.ManagementApp.ServiceConnectionName)
    deployServiceConnection: $(Environment.DeploymentUser.ServiceConnectionName)
    solutionSourcePattern: src/solutions/*/src
    packageSourcePatterns:
      - deploy/Defra.Imports.Deployment/*
    webResourceSourcePatterns: 
      - src/webresources/*
    assemblySourcePatterns:
      - src/common/*
      - src/pluginassemblies/*
    displayNamePrefix: $(Environment.DisplayNamePrefix)
    domainNamePrefix: $(Environment.DomainNamePrefix)
    location: $(Environment.Location)
    templates: D365_CustomerService
    securityGroupId: $(Environment.SecurityGroupId)
    adminSecurityGroupId: $(Environment.AdminSecurityGroupId)
    templateEnvironmentUrl: $(Environment.TemplateEnvironmentUrl)
    prepareEnvironmentJobs:
      - template: templates/jobs/create-application-user-job.yml
        parameters:
          jobName: CreateDeploymentApplicationUser
          jobDisplayName: Ensure deployment application user exists
          applicationId: $(Environment.DeploymentUser.ApplicationId)
          systemUserId: $(Environment.DeploymentUser.SystemUserId)
          applicationUserName: $(Environment.DeploymentUser.Username) 
          securityRoleName: System Administrator
          serviceConnection: $(Environment.ManagementApp.ServiceConnectionName)
      - template: templates/jobs/create-application-user-job.yml
        parameters:
          jobName: CreateTestsApplicationUser
          jobDisplayName: Ensure test application user exists
          applicationId: $(Tests.ApplicationUser.ApplicationId)
          securityRoleName: System Administrator
          serviceConnection: $(Environment.ManagementApp.ServiceConnectionName)
    preBuildSteps:
      - template: templates\steps\sonarqube-prepare-steps.yml@self
    postBuildSteps:
      - template: templates\steps\run-typescript-unit-tests-steps.yml@self
      - template: templates\steps\sonarqube-publish-steps.yml@self
    additionalPatterns:
      - filePatterns:
          - tests/Defra.Imports.IntegrationTests/*
          - tests/Defra.Imports.Scenarios/*
        stepName: GetIntegrationTestsUpdated
        stepDisplayName: Get integration tests updated
      - filePatterns:
          - tests/Defra.Imports.Scenarios/*
          - tests/Defra.Imports.PageObjects/*
          - tests/Defra.Imports.Specs/*
        stepName: GetAcceptanceTestsUpdated
        stepDisplayName: Get acceptance tests updated
    testJobs:
      - template: templates/jobs/run-dotnet-integration-tests-job.yml
        parameters:
          clientId: $(Tests.ApplicationUser.ApplicationId)
          keyVaultTenantId: $(KeyVault.TestUsers.TenantId)
          keyVaultClientId: $(KeyVault.TestUsers.ClientId)
          keyVaultClientSecret: $(KeyVault.TestUsers.ClientSecret)
          keyVaultName: $(KeyVault.TestUsers.Name)
          condition: |
            and(
              not(canceled()),
              or(
                and(
                  eq(stageDependencies.AnalyseUpdates.FindExistingEnvironment.outputs['FindWorkItemHyperlink.Relation.attributes.comment.commitHash'], ''),
                  or(
                    eq(stageDependencies.AnalyseUpdates.AnalyseUpdates.outputs['GetIntegrationTestsUpdated.IsUpdated'], 'True'),
                    eq(stageDependencies.AnalyseUpdates.AnalyseUpdates.outputs['GetPackageTemplateUpdated.IsUpdated'], 'True'),
                    eq(stageDependencies.AnalyseUpdates.AnalyseUpdates.outputs['GetSolutionUpdates.Backend.IsUpdated'], 'True')
                  )
                ),
                and(
                  ne(stageDependencies.AnalyseUpdates.FindExistingEnvironment.outputs['FindWorkItemHyperlink.Relation.attributes.comment.commitHash'], ''),
                  or(
                    eq(stageDependencies.AnalyseUpdates.AnalyseEnvironmentUpdates.outputs['GetIntegrationTestsUpdated.IsUpdated'], 'True'),
                    eq(stageDependencies.AnalyseUpdates.AnalyseEnvironmentUpdates.outputs['GetPackageTemplateUpdated.IsUpdated'], 'True'),
                    eq(stageDependencies.AnalyseUpdates.AnalyseEnvironmentUpdates.outputs['GetSolutionUpdates.Backend.IsUpdated'], 'True')
                  )
                )
              )
            )
      - template: templates/jobs/run-dotnet-acceptance-tests-job.yml
        parameters:
          clientId: $(Tests.ApplicationUser.ApplicationId)
          keyVaultTenantId: $(KeyVault.TestUsers.TenantId)
          keyVaultClientId: $(KeyVault.TestUsers.ClientId)
          keyVaultClientSecret: $(KeyVault.TestUsers.ClientSecret)
          keyVaultName: $(KeyVault.TestUsers.Name)
          parallelWorkers: $(Tests.Acceptance.Workers)
          dependsOn: RunDotNetIntegrationTests
          condition: |
            and(
              not(canceled()),
              in(dependencies.RunDotNetIntegrationTests.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
              or(
                and(
                  eq(stageDependencies.AnalyseUpdates.FindExistingEnvironment.outputs['FindWorkItemHyperlink.Relation.attributes.comment.commitHash'], ''),
                  or(
                    eq(stageDependencies.AnalyseUpdates.AnalyseUpdates.outputs['GetAcceptanceTestsUpdated.IsUpdated'], 'True'),
                    eq(stageDependencies.AnalyseUpdates.AnalyseUpdates.outputs['GetPackageTemplateUpdated.IsUpdated'], 'True'),
                    eq(stageDependencies.AnalyseUpdates.AnalyseUpdates.outputs['GetSolutionUpdates.Frontend.IsUpdated'], 'True'),
                    eq(stageDependencies.AnalyseUpdates.AnalyseUpdates.outputs['GetSolutionUpdates.Backend.IsUpdated'], 'True')
                  )
                ),
                and(
                  ne(stageDependencies.AnalyseUpdates.FindExistingEnvironment.outputs['FindWorkItemHyperlink.Relation.attributes.comment.commitHash'], ''),
                  or(
                    eq(stageDependencies.AnalyseUpdates.AnalyseEnvironmentUpdates.outputs['GetAcceptanceTestsUpdated.IsUpdated'], 'True'),
                    eq(stageDependencies.AnalyseUpdates.AnalyseEnvironmentUpdates.outputs['GetPackageTemplateUpdated.IsUpdated'], 'True'),
                    eq(stageDependencies.AnalyseUpdates.AnalyseEnvironmentUpdates.outputs['GetSolutionUpdates.Frontend.IsUpdated'], 'True'),
                    eq(stageDependencies.AnalyseUpdates.AnalyseEnvironmentUpdates.outputs['GetSolutionUpdates.Backend.IsUpdated'], 'True')
                  )
                )
              )
            )
    githubToken: $(GitHub.Token)
    config: PkgAssets/ImportConfig.Standalone.xml
