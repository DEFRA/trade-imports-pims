site_name: PIMS Requirements
site_description: >-
  Post Import Management System — Consolidated Requirements Baseline for
  Defra EU Imports risk assessment and post-import check management.
site_url: https://defra.github.io/trade-imports-pims/
repo_url: https://github.com/DEFRA/trade-imports-pims
repo_name: DEFRA/trade-imports-pims
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - toc.integrate

plugins:
  - search
  - panzoom

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js  
  - scripts/mermaid.js

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Scope & Context:
    - Vision & Scope: requirements/vision-and-scope.md
    - Assumptions & Constraints: requirements/assumptions-and-constraints.md
  - Specification:
    - Glossary: requirements/glossary.md
    - Business Rules: requirements/business-rules.md
    - Non-Functional Requirements: requirements/non-functional-requirements.md
  - Models & Flows:
    - Capability Map: requirements/diagrams/capability-map.md
    - Context Diagram: requirements/diagrams/context-diagram.md
    - Domain Model: requirements/diagrams/domain-model.md
    - Process Flows: requirements/diagrams/process-flows.md
    - Sequence Diagrams: requirements/diagrams/sequence-diagrams.md
  - Epics:
