info:
  name: Service Bus
  type: folder
  seq: 1

request:
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  scripts:
    - type: before-request
      code: |-
        const CryptoJS = require("crypto-js");

        const getVariable = (name) =>
          bru.getEnvVar(name) ?? bru.getVar(name);

        const servicebusNamespace = getVariable("servicebusNamespace");
        const queueName = getVariable("queueName");
        const sasKeyName = getVariable("sasKeyName");
        const sasKey = getVariable("sasKey");

        if (!servicebusNamespace || !queueName || !sasKeyName || !sasKey) {
          throw new Error(
            "Missing servicebusNamespace, queueName, sasKeyName, or sasKey. Set them in Bruno's active environment variables."
          );
        }

        // Sign against the queue rather than the namespace root so the token is scoped to one entity
        const resourceUri =
          `https://${servicebusNamespace}.servicebus.windows.net/${queueName}`;
        const encodedResourceUri = encodeURIComponent(resourceUri);
        const expires = Math.floor(Date.now() / 1000) + 60;
        const stringToSign = `${encodedResourceUri}\n${expires}`;

        // Azure SAS signs with the key string as-is (UTF-8); do not Base64-decode it first
        const signature = CryptoJS.HmacSHA256(stringToSign, sasKey)
          .toString(CryptoJS.enc.Base64);

        const sasToken =
          `SharedAccessSignature sr=${encodedResourceUri}` +
          `&sig=${encodeURIComponent(signature)}` +
          `&se=${expires}` +
          `&skn=${encodeURIComponent(sasKeyName)}`;

        // Leave request authentication as 'No Auth'; the header is set here
        req.setHeader("Authorization", sasToken);

        // Per-run values shared by the message bodies ({{eventId}} etc.)
        const now = new Date().toISOString();
        bru.setVar("eventId", bru.interpolate("{{$guid}}"));
        bru.setVar("eventTimestamp", now);
        bru.setVar("correlationId", `cid-${now.replace(/[-:.TZ]/g, "").slice(0, 14)}`);
