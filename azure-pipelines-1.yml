trigger:
  batch: true
  branches:
    include: ["master"]

pool:
  vmImage: 'windows-latest'

variables:
  SolutionNames: 'Defra.Imports.Analytics,Defra.Imports.Apps,Defra.Imports.Core,Defra.Imports.Plugins,Defra.Imports.SecurityModel,Defra.Imports.WebResources,Defra.Imports.Workflows'
  DynamicsEnvironment: 'https://defra-custmstr-eue-dev-imp.crm4.dynamics.com/'
  ExportPath: '$(Build.ArtifactStagingDirectory)/solutions'
  ZipFileName: 'DynamicsSolutions.zip'

steps:
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      Install-Module -Name Microsoft.PowerApps.Administration.PowerShell -Force -AllowClobber
      Install-Module -Name Microsoft.PowerApps.PowerShell -Force -AllowClobber
  displayName: 'Install Power Platform CLI'

- powershell: |
    echo Extracting solutions...
    mkdir $(ExportPath)
    $solutions = "$(SolutionNames)".Split(',')
    foreach ($solution in $solutions) {
      pac solution export --name $solution --path "$(ExportPath)/$solution.zip" --target "$(DynamicsEnvironment)"
    }
  displayName: 'Export Dynamics 365 Solutions'

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(ExportPath)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/$(ZipFileName)'
    replaceExistingArchive: true

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: '$(Build.ArtifactStagingDirectory)/$(ZipFileName)'
    artifactName: 'DynamicsSolutions'
    publishLocation: 'Container'

- task: CmdLine@2
  inputs:
    script: |
      git add $(Build.ArtifactStagingDirectory)/$(ZipFileName)
      git commit -m "Added Dynamics solutions ZIP"
      git push
  displayName: 'Commit and Push ZIP to Repo'
